# SonarCloud configuration for Paperless-NGX On-Demand
# Organization and projectKey can also be injected dynamically in GitHub Actions

sonar.sources=lib,scripts,bin
sonar.tests=test

# Coverage report location generated by vitest
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Encoding
sonar.sourceEncoding=UTF-8

# Exclusions: static base64 data, runtime bash/nginx configs, tests, build output
sonar.exclusions=lib/lambda/favicon-data.ts,runtime/**,data.json,paperless.config*.json,dist/**,docs/**
sonar.coverage.exclusions=lib/lambda/favicon-data.ts,test/**,scripts/**,bin/**

# TypeScript config
sonar.typescript.tsconfigPath=tsconfig.json

