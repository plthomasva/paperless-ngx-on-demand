name: GitHub Pages (Docs)

on:
  push:
    branches:
      - main
    paths:
      - 'docs/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
  workflow_run:
    workflows: ['Mutation Testing (Stryker)']
    types:
      - completed

concurrency:
  group: 'pages'
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
      actions: read
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: 'docs/package-lock.json'

      - name: Build Starlight Docs
        run: |
          cd docs
          npm ci --ignore-scripts
          npm run build
          cd ..

      - name: Fetch Latest Mutation Report
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RUN_ID=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow stryker.yml \
            --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [ -z "$RUN_ID" ]; then
            echo "No successful stryker.yml run found; publishing docs without a mutation report."
            exit 0
          fi
          echo "Downloading mutation-report from stryker.yml run $RUN_ID"
          mkdir -p reports/mutation
          gh run download "$RUN_ID" --repo "$GITHUB_REPOSITORY" \
            --name mutation-report --dir reports/mutation \
            || echo "Artifact unavailable; continuing without it."

      - name: Merge Reports into Docs
        run: |
          mkdir -p docs/dist/mutation
          cp -r reports/mutation/* docs/dist/mutation/ || true

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: 'docs/dist'

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
