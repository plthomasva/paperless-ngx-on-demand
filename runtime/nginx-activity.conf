# Nginx activity proxy configuration for Paperless-NGX
# Listens on port 8000, validates CloudFront custom secret header,
# updates /tmp/access.log timestamp on every request for the idle watchdog,
# and proxies traffic to Paperless-NGX on port 8080.

worker_processes 1;
pid /tmp/nginx.pid;
error_log /var/log/nginx/error.log warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Write access log to /tmp/access.log. Every HTTP request updates the mtime of this file,
    # which the watchdog reads via `stat -c %Y /tmp/access.log`.
    access_log /tmp/access.log combined;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Allow large document uploads up to 500MB
    client_max_body_size 500M;
    client_body_buffer_size 128k;

    # WebSocket connection upgrade mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 8000 default_server;
        server_name _;

        # Health check endpoint for boot-sync and CloudFront / ALB probes
        location = /__health {
            access_log off;
            return 200 "healthy\n";
        }

        # Status probe for wake-up status checks (bypasses header check)
        location = /api/tasks/ {
            # Allowed for internal localhost curls without secret header
            allow 127.0.0.1;
            allow ::1;
            # Or from CloudFront if token matches
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        # Static assets and crawler probes should not reset the idle activity timer
        location /static/ {
            access_log off;
            if ($http_x_origin_verify != "${ORIGIN_VERIFY_SECRET}") {
                return 403 "Direct access forbidden\n";
            }
            proxy_pass http://127.0.0.1:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
        }

        location = /robots.txt {
            access_log off;
            return 200 "User-agent: *\nDisallow: /\n";
        }

        location = /favicon.ico {
            access_log off;
            return 204;
        }

        location / {
            # Verify CloudFront origin secret header if configured
            # If ORIGIN_VERIFY_SECRET is set, reject direct requests missing the header
            if ($http_x_origin_verify != "${ORIGIN_VERIFY_SECRET}") {
                return 403 "Direct access forbidden\n";
            }

            proxy_pass http://127.0.0.1:8080;
            proxy_http_version 1.1;

            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-Host $host;

            proxy_read_timeout 600s;
            proxy_send_timeout 600s;
            proxy_buffering off;
        }
    }
}

